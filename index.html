<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語文言音查詢</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input { width: 70%; padding: 10px; font-size: 16px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
        .card { border: 1px solid #ccc; padding: 12px; margin-top: 10px; border-radius: 8px; background: #f9f9f9; }
    </style>
    <!-- 引入 sql.js 函式庫 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>

    <h2>台語文言音查詢</h2>
    <input type="text" id="textInput" placeholder="請輸入漢字（如：我人生學）">
    <button onclick="search()">查詢</button>
    <div id="result"></div>

    <script>
        let db = null;

        // 1. 初始化並載入 SQLite 資料庫
        async function initDB() {
            if (db) return db;
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
                });
                const response = await fetch('./taigi.db');
                if (!response.ok) throw new Error(`找不到 taigi.db，狀態碼：${response.status}`);
                
                const buffer = await response.arrayBuffer();
                db = new SQL.Database(new Uint8Array(buffer));
                return db;
            } catch (error) {
                console.error('資料庫載入失敗：', error);
                document.getElementById("result").innerHTML = `<div class="card" style="color:red;">資料庫載入失敗，請確認 taigi.db 是否與網頁放在同一目錄。</div>`;
                return null;
            }
        }

        // 2. 查詢邏輯
        async function search() {
            const text = document.getElementById("textInput").value;
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "查詢中...";

            const database = await initDB();
            if (!database) return;

            resultDiv.innerHTML = ""; // 清空提示

            if (!text.trim()) {
                resultDiv.innerHTML = `<div class="card">請輸入要查詢的漢字。</div>`;
                return;
            }

            // 逐字查詢
            for (let char of text) {
                if (!char.trim()) continue; // 忽略空格

                try {
                    // 假設資料表名稱為 words，欄位為 hanzi（請依實際資料庫結構調整）
                    const stmt = database.prepare("SELECT * FROM words WHERE hanzi = :word");
                    stmt.bind({ ':word': char });

                    let found = false;
                    while (stmt.step()) {
                        found = true;
                        const row = stmt.getAsObject(); // 取得包含所有欄位建物件
                        
                        // 動態拼出所有欄位與對應的值
                        let fieldsHtml = "";
                        for (let [columnName, value] of Object.entries(row)) {
                            if (columnName !== 'hanzi') {
                                fieldsHtml += `&nbsp;&nbsp;&nbsp;&nbsp;├─ ${columnName}：${value}<br>`;
                            }
                        }

                        resultDiv.innerHTML += `
                            <div class="card">
                                <strong>漢字：『${char}』</strong><br>
                                ${fieldsHtml}
                            </div>`;
                    }
                    stmt.free();

                    if (!found) {
                        resultDiv.innerHTML += `
                            <div class="card">
                                <strong>漢字：『${char}』</strong><br>
                                └─ 提示：資料庫暫無此字之紀錄。
                            </div>`;
                    }
                } catch (err) {
                    console.error(`查詢字「${char}」時發生錯誤：`, err);
                }
            }
        }
    </script>
</body>
</html>
